; Turkey Caller firmware: Wi-Fi softAP + control page + Bluetooth A2DP playback.
; Board: Freenove ESP32-WROOM-32E (4 MB flash, no PSRAM).

[env:esp32]
; pioarduino = Arduino core 3.3.0 on ESP-IDF 5.5
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; 921600 fails on the board's CH340 USB chip under macOS ("The chip stopped responding")
upload_speed = 460800
build_flags =
  -DCORE_DEBUG_LEVEL=2
  ; AsyncTCP's task stack (default 16 KB) is more than the web handlers need
  -DCONFIG_ASYNC_TCP_STACK_SIZE=6144
; The stock Arduino libraries enable BLE, hands-free, SPP and big Wi-Fi buffers, which left
; ~13 KB of heap with Wi-Fi + A2DP running. Rebuild them with only what this project uses.
; The first build after a change here takes several minutes (pioarduino recompiles ESP-IDF).
; Disable options with =n: PlatformIO drops "# CONFIG_X is not set" lines as ini comments.
; AVRCP cover art stays on: turning it off breaks the IDF 5.5.0 build (btc_avrc.c bug).
; PSRAM support stays on: the Arduino core is built with software atomics for it, and
; turning it off leaves __atomic_fetch_add_4 undefined at link time.
custom_sdkconfig =
  CONFIG_BTDM_CTRL_MODE_BR_EDR_ONLY=y
  CONFIG_BTDM_CTRL_MODE_BTDM=n
  CONFIG_BT_BLE_ENABLED=n
  CONFIG_BLE_MESH=n
  CONFIG_BT_BLE_BLUFI_ENABLE=n
  CONFIG_BT_HFP_ENABLE=n
  CONFIG_BT_SPP_ENABLED=n
  CONFIG_BT_ACL_CONNECTIONS=2
  CONFIG_BT_BTC_TASK_STACK_SIZE=4096
  CONFIG_BT_BTU_TASK_STACK_SIZE=4096
  CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=4
  CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=6
  CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=8
  CONFIG_ESP_WIFI_MGMT_SBUF_NUM=16
  CONFIG_ESP_WIFI_AMPDU_TX_ENABLED=n
  CONFIG_ESP_WIFI_AMPDU_RX_ENABLED=n
  CONFIG_ESP_WIFI_CSI_ENABLED=n
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
; Managed components we don't use. esp_insights also breaks the rebuild
; ("https_server.crt.S not found"), a known pioarduino issue.
custom_component_remove =
  espressif/esp_insights
  espressif/esp_rainmaker
  espressif/rmaker_common
  espressif/esp_diag_data_store
  espressif/esp_diagnostics
  espressif/esp-zboss-lib
  espressif/esp-zigbee-lib
  espressif/esp_modem
  espressif/esp-dsp
  chmorgan/esp-libhelix-mp3
lib_deps =
  ESP32Async/AsyncTCP@3.4.9
  ESP32Async/ESPAsyncWebServer@3.9.6
  https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.9
; prebuild: builds web/index.html into src/web_page.h and writes src/version.h (fails the build on error).
; check_size: fails the build if the app binary grows past 2.25 MB (90% of the app partition, see docs/architecture.md)
extra_scripts =
  pre:scripts/prebuild.py
  post:scripts/check_size.py
