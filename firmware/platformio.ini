; Turkey Caller firmware, Phase 0: Wi-Fi softAP + web page + Bluetooth A2DP MP3 playback.
; Board: Freenove ESP32-WROOM-32E (4 MB flash, no PSRAM).

[env:esp32]
; pioarduino = Arduino core 3.3.0 on ESP-IDF 5.5
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
build_flags =
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  ESP32Async/AsyncTCP@3.4.9
  ESP32Async/ESPAsyncWebServer@3.9.6
  https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.9
  https://github.com/pschatzmann/arduino-libhelix.git#v0.9.4
; Fails the build if the app binary grows past 2.25 MB (90% of the app partition, see docs/architecture.md)
extra_scripts =
  pre:scripts/embed_page.py
  post:scripts/check_size.py
