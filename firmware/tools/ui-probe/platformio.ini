; F15 probe for the WROVER-E: finds the LCD1602's I2C address and shows each big-button press.
; pio run -d firmware/tools/ui-probe -t upload -t monitor
[env:probe]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  marcoschwartz/LiquidCrystal_I2C@1.1.4
