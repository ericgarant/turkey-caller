; One-off probe for the WROVER-E: PSRAM size, flash size, and which SD wiring mounts.
; pio run -d firmware/tools/sd-probe -t upload -t monitor
[env:probe]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -DBOARD_HAS_PSRAM
