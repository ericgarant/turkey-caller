name: Firmware build

on:
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-6.1.19-${{ hashFiles('firmware/platformio.ini') }}
      # Pinned for the pioarduino ESP-IDF rebuild (custom_sdkconfig):
      # - PlatformIO 6.1.19 wants SCons 4.8.1, the version the platform installs; newer cores
      #   want 4.11.1 and the platform swaps it out mid-build ("No module named SCons.Tool...")
      # - the build calls click.parser.split_arg_string, which click 8.2+ breaks
      - run: pip install "platformio==6.1.19" "click<8.2"
      # Builds the app and fails if it is over the 2.25 MB budget (scripts/check_size.py)
      - run: pio run -d firmware
      # The LittleFS image builds even without the (non-redistributable) sounds
      - run: pio run -d firmware -t buildfs
