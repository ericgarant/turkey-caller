name: Firmware build

on:
  push:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      # Builds the app and fails if it is over the 1.8 MB budget (scripts/check_size.py)
      - run: pio run -d firmware
      # The LittleFS image builds even without the (non-redistributable) sounds
      - run: pio run -d firmware -t buildfs
